name: QuantTrade — Build & Push Container Images (GHCR)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Run Unit Tests & Lint
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Go Unit Tests
        run: |
          cd Quant_Trade/backend-go
          go vet ./...
          go test ./...

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Typecheck
        run: |
          cd Quant_Trade/frontend
          npm install -g pnpm
          pnpm install --no-frozen-lockfile --ignore-scripts
          npx tsc --noEmit

  # ============================================================================
  # 2. Build & Push Multi-Service Docker Images to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images to GHCR
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend-go
            dockerfile: Quant_Trade/backend-go/Dockerfile
          - service: ml-predictor
            dockerfile: Quant_Trade/ml/Dockerfile
          - service: frontend
            dockerfile: Quant_Trade/frontend/Dockerfile
          - service: exchange-sim
            dockerfile: Quant_Trade/exchange-sim/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: Quant_Trade
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quant-trade/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/quant-trade/${{ matrix.service }}:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
